pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx @biomejs/biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: bun tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
