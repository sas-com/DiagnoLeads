# Lighthouse of production (#569, decision 2026-10-24-performance-targets): once a day and by
# hand, the five public pages on mobile and desktop, three runs each, with Lighthouse 13.5.0.
# Measures only for now: the medians go to the run's summary page and the JSON reports are kept
# 30 days as an artifact. Nothing fails or opens an issue on the scores yet; that judgement is
# added once a baseline exists after the launch (#612, budgets #613). Kept out of the PR checks so
# CI stays light (decision 2026-10-18-ci-light-and-audit-gate). A run fails only when Lighthouse
# produced no result.
name: Lighthouse

on:
  schedule:
    # 03:17 JST; scheduled runs can start late
    - cron: '17 18 * * *'
  workflow_dispatch:
  # Trial only (this branch is deleted after the run; never merged)
  push:
    branches: [chore/569-lighthouse-trial]

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  measure:
    name: Measure production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://diagnoleads-v2.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/lighthouse-*
          sparse-checkout-cone-mode: false

      # Runs Lighthouse and the TypeScript of the two scripts (type stripping); Chrome is the
      # runner's own (its version is in the summary)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Lighthouse
        run: bash scripts/lighthouse-run.sh lighthouse-reports

      - name: Summarize
        if: always()
        run: node scripts/lighthouse-summary.ts lighthouse-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
          if-no-files-found: warn
