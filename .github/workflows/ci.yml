name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # feat/** so that stacked PRs (based on another feature branch) are checked too
    branches: [main, develop, 'feat/**']

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; main runs E2E and coverage, so let them finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a new Bun release cannot break CI overnight; bump it on purpose
  BUN_VERSION: '1.4.3'

jobs:
  # Every job but E2E (which needs the build) starts at once rather than after lint: lint did not fail
  # once in 100 pull request runs, so waiting on it only added about a minute to each run (#1104)
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck

      # ja and en have the same keys in each locales/ file (#472)
      - name: Check translations
        run: bun run i18n:check

      - name: Check import boundaries (docs/ARCHITECTURE.md)
        run: bun run arch:check

  test:
    name: Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (shard ${{ matrix.shard }})
        run: bun run test --run --shard=${{ matrix.shard }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    # Re-runs the whole suite, so only measure on main (PRs already run the sharded tests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage with thresholds
        run: bun run test:coverage --run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # The whole build (without the cache): the E2E job runs it with `next start`
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nextjs-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diagnoleads_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create database schemas and extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnoleads_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnoleads_test -c "CREATE EXTENSION IF NOT EXISTS ltree;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnoleads_test -c "CREATE SCHEMA IF NOT EXISTS drizzle;"

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test
          BETTER_AUTH_SECRET: e2e-test-secret-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_ENV_VALIDATION: true

      - name: Run database integration tests
        # Not optional: these run against the real PostgreSQL above (migrations, locks, SQL)
        run: bunx vitest --run test/unit/integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test
          BETTER_AUTH_SECRET: e2e-test-secret-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # Smoke tests (@smoke) against the production build, on pull requests too (#211)
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diagnoleads_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        # The runner image already has the libraries Chromium needs; --with-deps adds fonts through
        # apt. When that fails (apt could not reach its mirror for hours on 2026-11-11), go on with the
        # browser alone (#1088): the E2E tests read the DOM, not screenshots, and a library that is
        # really missing still fails the launch. The step takes about 20 seconds (under 40 in the runs
        # checked), so the first try gets 1 minute rather than the 10 minutes apt spends before it
        # gives up (#1098). The limit also covers the browser download; apt itself keeps running in
        # the background after it (sudo does not pass the signal on), which nothing later depends on
        run: |
          if ! timeout 60 bunx playwright install --with-deps chromium; then
            echo "::warning title=Playwright OS dependencies::playwright install --with-deps failed (see the log above); installing Chromium without OS dependencies, so screenshots and traces show no Japanese glyphs (#1088)"
            bunx playwright install chromium
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: nextjs-build
          path: .next

      - name: Create database schemas and extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnoleads_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnoleads_test -c "CREATE EXTENSION IF NOT EXISTS ltree;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnoleads_test -c "CREATE SCHEMA IF NOT EXISTS drizzle;"

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test
          BETTER_AUTH_SECRET: e2e-test-secret-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SKIP_ENV_VALIDATION: true

      - name: Create organization for the AX diagnosis E2E
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d diagnoleads_test -c "INSERT INTO organizations (id, name, slug) VALUES ('00000000-0000-4000-8000-0000000000a1', 'AX E2E', 'ax-e2e') ON CONFLICT DO NOTHING;"

      - name: Create the users the E2E tests sign in with
        run: bun run test:e2e:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test
          SKIP_ENV_VALIDATION: true

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          # The downloaded production build with `next start` (playwright.config.ts)
          E2E_USE_BUILD: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diagnoleads_test
          BETTER_AUTH_SECRET: e2e-test-secret-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AX_DIAGNOSIS_ORGANIZATION_ID: 00000000-0000-4000-8000-0000000000a1
          # Same as production until the public launch: noindex everywhere, mail only to allowed domains
          APP_TEST_MODE: 'true'
          APP_TEST_MODE_EMAIL_DOMAINS: example.com

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        # Fails on critical only: some high advisories sit in transitive packages with no fix yet
        run: bun audit --audit-level=critical

  # Note: Preview deployment is handled by Vercel GitHub Integration
